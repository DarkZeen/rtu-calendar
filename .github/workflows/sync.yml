name: Sync RTU timetable

on:
  schedule:
    # Every hour at :17. Off the hour on purpose -- GitHub's scheduler is
    # busiest exactly on the hour and silently delays jobs queued there.
    # Your calendar client's own refresh rate is usually the real limit.
    - cron: "17 * * * *"
  workflow_dispatch:          # lets you run it by hand from the Actions tab
  push:
    paths:
      - "config.json"             # re-publish immediately when the include-list changes
      - "rtusync/**"
      - ".github/workflows/**"    # so a change to this file gets exercised at once

permissions:
  contents: write

concurrency:
  group: rtu-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # RTU occasionally 524s for minutes at a time; never let that pin a runner.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # No setup-python step: rtusync is stdlib-only and ubuntu-latest ships
      # a recent python3. Nothing to install, nothing to pin, nothing to rot.
      - name: Show Python version
        run: python3 --version

      - name: Build planning.ics
        run: python3 -m rtusync build

      - name: Rebuild the subject picker
        run: python3 -m rtusync picker

      - name: Monthly heartbeat
        run: |
          # GitHub disables scheduled workflows after 60 days of repository
          # inactivity. A stable timetable now produces no commits at all, so
          # this guarantees one commit a month -- and never more than one.
          MONTH=$(date -u '+%Y-%m')
          MARKER=".sync-alive"
          if [ ! -f "$MARKER" ] || [ "$(tail -n 1 "$MARKER")" != "$MONTH" ]; then
            {
              echo "# Touched once a month so GitHub keeps the scheduled workflow"
              echo "# enabled. Its only moving part is the line below."
              echo "$MONTH"
            } > "$MARKER"
            echo "heartbeat: wrote $MONTH"
          else
            echo "heartbeat: already current ($MONTH)"
          fi

      - name: Commit only if the timetable actually moved
        run: |
          # changes.md only exists once something has actually changed, so build
          # the list from what is really on disk -- git add on a missing path is
          # a fatal error, not a no-op.
          FILES=""
          for f in planning.ics picker.html state.json changes.md .sync-alive; do
            if [ -f "$f" ]; then FILES="$FILES $f"; fi
          done
          if [ -z "$FILES" ]; then
            echo "Nothing was built; leaving the tree alone."
            exit 0
          fi
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "Timetable unchanged; nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $FILES
          SUBJECT="RTU timetable: $(date -u '+%Y-%m-%d %H:%M')"
          if [ -f changes.md ]; then
            N=$(git diff --cached -U0 -- changes.md | grep -c '^+- `' || true)
            if [ "${N:-0}" -gt 0 ]; then
              SUBJECT="RTU timetable: $N change(s) on $(date -u '+%Y-%m-%d')"
            fi
          fi
          git commit -m "$SUBJECT"
          git push
